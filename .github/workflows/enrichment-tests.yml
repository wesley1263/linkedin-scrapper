name: enrichment-tests

on:
  push:
    paths: ["enrichment/**", ".github/workflows/enrichment-tests.yml"]
  pull_request:
    paths: ["enrichment/**", ".github/workflows/enrichment-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: enrichment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: enrichment/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
