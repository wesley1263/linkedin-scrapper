# Ambiente integrado (ADR-0013). Futuro repositório `linkedin-enrichment-dev`; os repositórios dos serviços
# ficam clonados lado a lado (../linkedin-collector, ../linkedin-enrichment).
# Valores fixos abaixo são só de desenvolvimento local e nunca devem ser reutilizados em outro ambiente.
name: linkedin-enrichment

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: enrichment
      POSTGRES_USER: enrichment
      POSTGRES_PASSWORD: enrichment
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enrichment"]
      interval: 5s

  # S3 local. O MinIO deixou de publicar imagens (Docker Hub e Quay): usamos o S3Mock da Adobe, que cria o bucket
  # na subida e aceita escrita condicional (If-None-Match), necessária para os zips imutáveis. Endpoint: http://localhost:9000
  s3:
    image: adobe/s3mock
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: raw-profiles
    ports: ["9000:9090"]

  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s

  vault:
    image: hashicorp/vault
    command: server -dev -dev-root-token-id=dev-root
    cap_add: [IPC_LOCK]
    ports: ["8200:8200"]

  # Serviços de aplicação (api, parser-worker, collector): entram aqui quando tiverem Dockerfile e drivers
  # de fila/storage (ADR-0014, ADR-0003); a definição completa está no ADR-0013.

volumes:
  pgdata:
  miniodata:
